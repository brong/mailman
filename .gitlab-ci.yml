variables:
  LC_ALL: "C.UTF-8"
  HOME_ORIG: "/home/runner"
  HOME: "/builds"
  GIT_CEILING_DIRECTORIES: "$HOME"

default:
  image: ghcr.io/maxking/mailman-ci-runner:latest
  retry:
    max: 2
    when:
      - no_updates_running
      - server_timeout_running
  before_script:
    - cat /etc/os-release
    - uname -a
    - id
    - env
    # Create a symlink at /builds/.local pointing to /home/runner/.local
    # (includes the Python user install directory)
    - '[ "$HOME" != "$HOME_ORIG" ] && ln -s "$HOME_ORIG/.local" "$HOME/"'

stages:
  - code
  - docs
  - test

.only-default:
  only:
    - master
    - merge_requests
    - tags
    - web

code-qa:
  stage: code
  needs: []
  extends: .only-default
  script:
    - python3 -m tox -e qa

code-diffcov:
  stage: code
  needs: []
  script:
    - git config --global --add safe.directory "$HOME/$CI_PROJECT_NAMESPACE/mailman"
    - git config safe.directory
    - python3 -m tox -e py311-diffcov
  only:
    - merge_requests

docs:
  stage: docs
  needs: []
  extends: .only-default
  script:
    - python3 -m tox -e docs

test-sqlite:
  stage: test
  needs: []
  extends: .only-default
  parallel:
    matrix:
      - PYTHON_VER: ["310", "311", "312", "313"]
  script:
    - python3 -m tox -e "py$PYTHON_VER-nocov"

test-postgres:
  stage: test
  needs: []
  extends: .only-default
  variables:
    MAILMAN_EXTRA_TESTING_CFG: "$HOME_ORIG/configs/postgres.cfg"
    POSTGRES_DB: "mailman_test"
    POSTGRES_USER: "runner"
    POSTGRES_PASSWORD: "runner"
  services:
    - postgres:latest
  parallel:
    matrix:
      - PYTHON_VER: ["310", "311", "312", "313"]
  script:
    - python3 -m tox -e "py$PYTHON_VER-nocov-pg"

test-mysql:
  stage: test
  needs: []
  extends: .only-default
  variables:
    MAILMAN_EXTRA_TESTING_CFG: "$HOME_ORIG/configs/mysql.cfg"
    MYSQL_DATABASE: "test_mailman"
    MYSQL_ROOT_PASSWORD: "runner"
    MYSQL_USER: "runner"
    MYSQL_USER_PASSWORD: "runner"
  services:
    - mysql:5.6
  parallel:
    matrix:
      - PYTHON_VER: ["310", "311", "312", "313"]
  script:
    - python3 -m tox -e "py$PYTHON_VER-nocov-mysql"
